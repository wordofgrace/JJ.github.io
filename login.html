<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/jpeg" href="./images/favicon.jpg">

<title>Login • Jehovah Jireh</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#F7F6F2;
  color:#4B6587;
  padding:20px;
}

/* ===== Login Container ===== */

.login-container{
  width:100%;
  max-width:420px;
}

/* ===== Login Card ===== */

.login-card{
  background:#F7F6F2;
  border:1px solid #F0E5CF;
  border-radius:22px;
  padding:40px 34px;
  text-align:center;
  box-shadow:
    0 18px 40px rgba(75,101,135,.12);
}

/* ===== Logo ===== */

.logo-wrap{
  width:120px;
  height:120px;
  margin:0 auto 22px;
  border-radius:50%;
  padding:5px;
  background:linear-gradient(
    135deg,
    #4B6587,
    #F0E5CF
  );
  box-shadow:
    0 10px 30px rgba(75,101,135,.20);
}

.logo{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  display:block;
  border:3px solid #F7F6F2;
}

/* ===== Heading ===== */

h1{
  font-family:'Cormorant Garamond',serif;
  font-size:44px;
  color:#4B6587;
  margin-bottom:6px;
  font-weight:700;
}

.subtitle{
  color:#4B6587;
  opacity:.75;
  font-size:14px;
  margin-bottom:28px;
}

/* ===== Inputs ===== */

.input-group{
  text-align:left;
  margin-bottom:16px;
}

label{
  display:block;
  font-size:13px;
  font-weight:600;
  color:#4B6587;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:14px 15px;
  border:1.5px solid #F0E5CF;
  border-radius:11px;
  background:#F7F6F2;
  color:#4B6587;
  font-size:15px;
  transition:.2s;
}

input::placeholder{
  color:#4B6587;
  opacity:.45;
}

input:focus{
  outline:none;
  border-color:#4B6587;
  box-shadow:
    0 0 0 3px rgba(75,101,135,.12);
}

/* ===== Login Button ===== */

.login-btn{
  width:100%;
  margin-top:8px;
  padding:14px;
  border:none;
  border-radius:11px;
  background:#4B6587;
  color:#F7F6F2;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:.25s ease;
}

.login-btn:hover{
  background:#3E5675;
}

.login-btn:active{
  transform:scale(.98);
}

.login-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* ===== Error ===== */

.error{
  display:none;
  margin-top:15px;
  padding:10px;
  border-radius:9px;
  background:#F0E5CF;
  color:#4B6587;
  font-size:13px;
  font-weight:500;
}

/* ===== Footer ===== */

.footer{
  margin-top:22px;
  font-size:12px;
  color:#4B6587;
  opacity:.65;
}

/* ===== Mobile ===== */

@media(max-width:480px){

  body{
    padding:16px;
  }

  .login-card{
    padding:34px 22px;
    border-radius:20px;
  }

  .logo-wrap{
    width:105px;
    height:105px;
    margin-bottom:20px;
  }

  h1{
    font-size:40px;
  }

  .subtitle{
    font-size:13px;
    margin-bottom:24px;
  }

  input{
    padding:13px 14px;
  }

  .login-btn{
    padding:13px;
  }
}
</style>
</head>

<body>

<div class="login-container">

  <div class="login-card">

    <div class="logo-wrap">
      <img
        src="./images/logo.png"
        class="logo"
        alt="Jehovah Jireh">
    </div>

    <h1>Jehovah Jireh</h1>

    <p class="subtitle">
      United in Prayer • Growing in Christ
    </p>

    <form id="loginForm">

      <div class="input-group">

        <label for="username">
          Username
        </label>

        <input
          type="text"
          id="username"
          placeholder="Enter username"
          autocomplete="username"
          required>

      </div>

      <div class="input-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter password"
          autocomplete="current-password"
          required>

      </div>

      <button
        type="submit"
        class="login-btn"
        id="loginButton">
        Sign In
      </button>

      <div
        class="error"
        id="errorMessage">
      </div>

    </form>

    <div class="footer">
      Prayer Community
    </div>

  </div>

</div>

<script>

/* =========================================
   SUPABASE CONFIGURATION
   ========================================= */

const SUPABASE_URL =
  "https://dmvztbtquvhugyctipok.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_bw1rR4KOVLtEEs0xrBoMZg_u3ssTmOV";

const client =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   LOGIN DETAILS
   ========================================= */

const USERNAME = "user";
const SUPABASE_EMAIL = "user@email.com";


/* =========================================
   SESSION DURATION
   3 MINUTES
   ========================================= */

const SESSION_DURATION = 7 * 60 * 1000;


/* =========================================
   LOGIN
   ========================================= */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function(event){

      event.preventDefault();

      const username =
        document
          .getElementById("username")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;

      const button =
        document.getElementById("loginButton");

      const error =
        document.getElementById("errorMessage");

      error.style.display = "none";


      /* Check username */

      if(username !== USERNAME){

        error.textContent =
          "Incorrect username or password.";

        error.style.display = "block";

        return;
      }


      /* Disable button */

      button.disabled = true;
      button.textContent = "Signing in...";


      /* Supabase Login */

      const { error: loginError } =
        await client.auth.signInWithPassword({
          email: SUPABASE_EMAIL,
          password: password
        });


      /* Login failed */

      if(loginError){

        error.textContent =
          "Incorrect username or password.";

        error.style.display = "block";

        button.disabled = false;
        button.textContent = "Sign In";

        return;
      }


      /* Save login time */

      sessionStorage.setItem(
        "jj_login_time",
        Date.now().toString()
      );


      /* Go to main website */

      window.location.replace("index.html");

    }
  );

</script>

</body>
</html>
