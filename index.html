<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jehovah Jireh</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}body{background:#fff;color:#111827}
header{text-align:center;padding:52px 20px;border-bottom:1px solid #E5E7EB}.logo{width:90px;height:90px;border-radius:50%;object-fit:cover;margin-bottom:12px}
h1{color:#047857;font-size:42px}.sub{color:#4B5563}.ps{color:#047857;font-weight:600}
.wrap{max-width:1180px;margin:auto;padding:36px 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}
.card{border:1px solid #E5E7EB;border-radius:16px;overflow:hidden;background:#fff}.card img{width:100%;height:170px;object-fit:cover}.content{padding:18px;text-align:center}
.count{font-size:42px;color:#047857;font-weight:700;margin:14px 0}button{width:100%;padding:12px;background:#047857;color:#fff;border:none;border-radius:10px;font-weight:600}
</style></head><body>
<header><img src="./images/logo.png" class="logo"><h1>Jehovah Jireh</h1><p class="sub">“The Lord is my shepherd, I shall not want.”</p><p class="ps">Psalm 23:1</p></header>
<div class="wrap"><h2>Contribute Prayers</h2><p style="color:#6B7280;margin:8px 0 24px">Offer your prayers in unity with the community.</p><div class="grid" id="cards"></div></div>
<script>
const client=supabase.createClient("https://dmvztbtquvhugyctipok.supabase.co","sb_publishable_bw1rR4KOVLtEEs0xrBoMZg_u3ssTmOV");
const prayers=[
["holy_mass","Holy Mass","./images/mass.jpg"],
["rosary","Rosary","./images/rosary.jpg"],
["divine_mercy","Divine Mercy","./images/divine.jpg"],
["hail_mary","Hail Mary","./images/mary.jpg"],
["our_father","Our Father","./images/trinity.jpg"],
["apostles_creed","Apostles' Creed","./images/pentecost.jpg"],
["adoration","Adoration","./images/adoration.jpg"]];
const cards=document.getElementById("cards");
prayers.forEach(([k,t,img])=>cards.innerHTML+=`<div class="card"><img src="${img}" alt="${t}"><div class="content"><h3>${t}</h3><div id="${k}" class="count">0</div><button onclick="inc('${k}')">Offer Prayer</button></div></div>`);
async function load(){const{data}=await client.from("prayer_counts").select("*").eq("id",1).single();if(!data)return;Object.keys(data).forEach(k=>{const e=document.getElementById(k);if(e)e.textContent=data[k]})}
async function inc(c){const{data}=await client.from("prayer_counts").select(c).eq("id",1).single();await client.from("prayer_counts").update({[c]:data[c]+1}).eq("id",1);load()}
load();
</script></body></html>
